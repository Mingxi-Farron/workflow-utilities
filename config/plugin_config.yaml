# Workflow Utilities Plugin Configuration

plugin:
  name: workflow-utilities
  version: 1.4.0

# Language setting: zh-CN | en
language: zh-CN

# Feature toggles
features:
  git_guard: true
  mode_control: true
  plan: true
  handoff: true
  plan_loader: true
  optimization_ticket: true
  task_execution: true
  roundtable: true

# File paths (customizable per project)
paths:
  workflow_config: WORKFLOW_CONFIG.md
  ticket_index: tickets/INDEX.md
  ticket_dir: tickets/
  ticket_active: tickets/active/
  ticket_archive: tickets/archive/
  plan_dir: .claude/docs/plan/
  handoff_dir: .claude/docs/handoff/

# Default SUPERVISED mode permissions
supervised_defaults:
  auto_approve:
    # --- Built-in tools ---
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - WebSearch
    # --- Git (read-only) ---
    - Bash(git status)
    - Bash(git diff)
    - Bash(git log *)
    - Bash(git branch *)
    # --- File operations (non-destructive) ---
    - Bash(mkdir:*)
    - Bash(cp:*)
    - Bash(ls:*)
    # --- Plugin commands ---
    - Skill(workflow-utilities:mode)
    - Skill(workflow-utilities:commit)
    - Skill(workflow-utilities:plan)
    - Skill(workflow-utilities:handoff)
    - Skill(workflow-utilities:task)
    - Skill(workflow-utilities:ticket)
    - Skill(workflow-utilities:roundtable)
  require_confirm:
    - Bash(git commit *)
    - Bash(git push *)
    - Bash(rm *)
    - Bash(mv *)
    - Bash(git reset *)
